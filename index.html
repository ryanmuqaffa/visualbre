// pencatat log: dimuat paling awal agar error skrip utama pun tercatat
(function(){
  var K="visual_stock_log",M=60,L=[];
  try{L=JSON.parse(localStorage.getItem(K))||[];if(!Array.isArray(L))L=[]}catch(e){L=[]}
  window.__log=function(lv,msg){
    try{
      L.push({t:Date.now(),l:lv,m:String(msg).slice(0,500)});
      if(L.length>M)L.splice(0,L.length-M);
      try{localStorage.setItem(K,JSON.stringify(L))}catch(e){}
      if(window.__onlog)window.__onlog();
    }catch(e){}
  };
  window.__logs=function(){return L};
  window.__clearLogs=function(){L.length=0;try{localStorage.removeItem(K)}catch(e){}};
  window.addEventListener("error",function(e){
    __log("error",(e.message||"error")+(e.filename?" @"+e.filename.split("/").pop()+":"+e.lineno+":"+e.colno:""));
  });
  window.addEventListener("unhandledrejection",function(e){
    __log("error","Promise: "+((e.reason&&e.reason.message)||e.reason));
  });
})();

.toast{z-index:60;position:fixed;left:50%;bottom:calc(62px + env(safe-area-inset-bottom,0px));width:max-content;max-width:90vw;text-align:center;line-height:1.35;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
dialog.pf{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);margin:0 auto;z-index:40;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
.acts.sm button{font-size:13px;padding:0 4px}
.acts.sm{border-top:0;padding-top:0}
#dbgOut{font-size:12px;line-height:1.45}
</style>
</head>

<script>
(function(){
  var KEY="visual_stock_v5";
  var BULAN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
  var HARI=["Minggu","Senin","Selasa","Rabu","Kamis","Jumat","Sabtu"];
  var SHIFT_JAM={"1":"07.30","2":"19.30"};

  var TCT=["4C","4D","5C","5D","6C","6D","7C","7D"];
  var JETTY=[
    {id:"R",nama:"Jetty R",groups:[{g:"KPP G",opts:["H1","H2","H3"]},{g:"HRS G",opts:["H1","H2","H3"]}]},
    {id:"J",nama:"Jetty J",groups:[{g:"KPP G",opts:["Ong 2","Ong 4"]},{g:"HRS G",opts:["Ong 2","Ong 4"]}]},
    {id:"U",nama:"Jetty U",groups:[{g:"KPP G",opts:null},{g:"HRS G",opts:null}]},
    {id:"K",nama:"Jetty K",groups:[{g:"KPP G",opts:["F1","F3"]},{g:"HRS G",opts:["F2","F4"]}]},
    {id:"TCT",nama:"JETTY TCT",groups:[{g:"KPP G",opts:TCT},{g:"HRS G",opts:TCT}]}
  ];

  function p2(n){return (n<10?"0":"")+n}
  function today(){var d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
  function blank(){return {tgl:today(),shift:"",jam:"",f:{}}}
  function clean(x){
    if(!x||typeof x!=="object"||!x.f||typeof x.f!=="object")return blank();
    var r={tgl:/^\d{4}-\d{2}-\d{2}$/.test(x.tgl)?x.tgl:today(),shift:(x.shift==="1"||x.shift==="2")?x.shift:"",jam:"",f:{}};
    Object.keys(x.f).forEach(function(k){
      if(!Array.isArray(x.f[k]))return;
      r.f[k]=x.f[k].filter(function(c){return c&&typeof c==="object"}).map(function(c){
        return {o:String(c.o||""),v:String(c.v||""),n:String(c.n||"")}});
    });
    return r;
  }
  function load(){try{return clean(JSON.parse(localStorage.getItem(KEY)))}catch(e){}return blank()}
  var saveErr=false;
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){if(!saveErr){saveErr=true;__log("error","Gagal simpan: "+e.message)}}}
  var S=load();
  function blankRow(){return {o:"",v:"",n:""}}
  function used(r){return !!((r.o||"")||(r.v||"").trim()||(r.n||"").trim())}
  function rowsOf(j,g){var k=j.id+"|"+g.g;S.f[k]=(S.f[k]||[]).filter(used);if(!S.f[k].length)S.f[k]=[blankRow()];return S.f[k]}

  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  var app=document.getElementById("secs");
  function noAuto(e){e.autocomplete="off";e.spellcheck=false;e.setAttribute("autocorrect","off");e.enterKeyHint="next"}

  function render(){
    app.innerHTML="";
    JETTY.forEach(function(j){
      var sec=el("section");sec.id="j-"+j.id;sec.appendChild(el("h2",null,j.nama));
      j.groups.forEach(function(g){
        var cls=g.g.indexOf("KPP")===0?"k":"h";
        var arr=rowsOf(j,g);
        sec.appendChild(el("div","gh "+cls,g.g));
        var box=el("div");sec.appendChild(box);
        function mkRow(c){
          var r=el("div","row");var base=j.nama+" "+g.g+", baris "+(arr.indexOf(c)+1);
          if(g.opts){
            var sel=el("select",c.o?"f":"");sel.setAttribute("aria-label",base+" pilihan");
            var o0=el("option",null,"Pilih");o0.value="";sel.appendChild(o0);
            g.opts.forEach(function(x){var o=el("option",null,x);o.value=x;sel.appendChild(o)});
            sel.value=c.o;
            sel.onchange=function(){c.o=sel.value;sel.className=c.o?"f":"";save();grow()};
            r.appendChild(sel);
          }else{r.appendChild(el("div","lb",g.g))}
          var v=el("input","v"+(c.v?" f":""));v.type="text";v.inputMode="numeric";v.placeholder="mt";v.value=c.v;v.setAttribute("aria-label",base+" tonase");
          var n=el("input","n");n.type="text";n.placeholder="ket";n.value=c.n;n.setAttribute("aria-label",base+" keterangan");noAuto(v);noAuto(n);
          var last=v.value;
          v.oninput=function(){
            var raw=v.value,pos=v.selectionStart==null?raw.length:v.selectionStart,out=raw,np=null;
            var m=/^(\s*[+\-\u2212\u2013\u00b1]?\s*)([\d.,\s]*)$/.exec(raw);
            if(m){
              var dg=m[2].replace(/\D/g,"").replace(/^0+(?=\d)/,"");
              out=m[1]+dg.replace(/\B(?=(\d{3})+(?!\d))/g,".");
              var cnt=(raw.slice(0,pos).replace(/^\s*[+\-\u2212\u2013\u00b1]?\s*/,"").match(/\d/g)||[]).length,i=m[1].length;
              while(cnt>0&&i<out.length){if(/\d/.test(out.charAt(i)))cnt--;i++}
              np=i;
            }
            if(out!==v.value){v.value=out;if(np!==null){try{v.setSelectionRange(np,np)}catch(e){}}}
            last=v.value;c.v=v.value;v.classList.toggle("f",!!v.value.trim());save();grow();
          };
          v.onchange=function(){var f=fmt(v.value);if(f&&f!==v.value){v.value=f;c.v=f;last=f;save()}};
          n.oninput=function(){c.n=n.value;save();grow()};
          var enter=function(e){
            if(e.key!=="Enter")return;e.preventDefault();
            var all=[].slice.call(sec.querySelectorAll("input")),i=all.indexOf(e.target);
            if(all[i+1])all[i+1].focus();
          };
          v.onkeydown=enter;n.onkeydown=enter;
          // baris tengah yang dikosongkan dihapus saat fokus pindah (baris kosong terakhir tetap ada)
          r.addEventListener("focusout",function(e){
            if(r.contains(e.relatedTarget))return;
            var i=arr.indexOf(c);
            if(i<0||i>=arr.length-1||used(c))return;
            arr.splice(i,1);box.removeChild(r);save();
            [].forEach.call(box.children,function(row,k){[].forEach.call(row.querySelectorAll("[aria-label]"),function(x){x.setAttribute("aria-label",x.getAttribute("aria-label").replace(/baris \d+/,"baris "+(k+1)))})});
          });
          r.appendChild(v);r.appendChild(n);return r;
        }
        // baris kosong baru muncul otomatis setelah baris terakhir dipakai
        function grow(){
          if(used(arr[arr.length-1])){var c=blankRow();arr.push(c);save();box.appendChild(mkRow(c))}
        }
        arr.forEach(function(c){box.appendChild(mkRow(c))});
        grow();
      });
      app.appendChild(sec);
    });
  }

  // ---------- header ----------
  var tgl=document.getElementById("tgl"),jam=document.getElementById("jam");
  var sb=document.querySelectorAll(".hrow button");
  function syncHead(){
    if(S.shift)S.jam=SHIFT_JAM[S.shift];
    tgl.value=S.tgl;jam.value=S.jam||"";
    sb.forEach(function(b){var on=b.dataset.s===S.shift;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on?"true":"false")});stale();
  }
  var autoDate=false;
  function autoShiftDate(){
    var n=new Date();
    if(S.shift==="2"&&n.getHours()<8&&S.tgl===today()){n.setDate(n.getDate()-1);S.tgl=ymd(n);autoDate=true}
    else if(S.shift==="1"&&autoDate){S.tgl=today();autoDate=false}
  }
  tgl.onchange=function(){autoDate=false;S.tgl=tgl.value||today();tgl.value=S.tgl;save();stale()};
  sb.forEach(function(b){b.onclick=function(){S.shift=b.dataset.s;S.jam=SHIFT_JAM[S.shift];autoShiftDate();save();syncHead()}});

  // ---------- laporan ----------
  function fmt(v){
    v=(v||"").trim();if(!v)return "";
    v=v.replace(/[\u2212\u2013]/g,"-").replace(/\s*(mt|ton)\.?$/i,"");
    var m=v.match(/^([+\-\u00b1])\s*(.*)$/),sign="";
    if(m){sign=m[1]+" ";v=m[2]}
    if(!v)return "";
    if(/^[\d.,\s]+$/.test(v)){var dg=v.replace(/\D/g,"").replace(/^0+(?=\d)/,"");if(dg!=="")v=dg.replace(/\B(?=(\d{3})+(?!\d))/g,".")}
    return sign+v;
  }
  var AB=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];
  function monAb(){var m=parseInt((S.tgl||"").slice(5,7),10);if(!(m>=1&&m<=12))m=new Date().getMonth()+1;return AB[m-1]}
  function moFix(mo){mo=mo.toLowerCase();if(mo==="agt")mo="agu";return mo.charAt(0).toUpperCase()+mo.slice(1)}
  function tidyNote(n){
    n=(n||"").replace(/\s+/g," ").trim();
    var MO="jan|feb|mar|apr|mei|jun|jul|agu|agt|sep|okt|nov|des";
    var SEP="(?:\\s*[.,]\\s*|\\s+)";
    var D="(?:3[01]|[12]\\d|0?[1-9])";
    n=n.replace(new RegExp("(\\d{1,2}(?:"+SEP+"\\d{1,2})+)\\s*("+MO+")\\b","gi"),function(_,list,mo){return list.split(/\s*[.,]\s*|\s+/).join(", ")+" "+moFix(mo)});
    n=n.replace(new RegExp("(\\d)\\s*("+MO+")\\b","gi"),function(_,d,mo){return d+" "+moFix(mo)});
    // tanggal tanpa nama bulan: bulan mengikuti tanggal laporan yang dipilih
    return n.replace(new RegExp("(^|,\\s*|\\b(?:tgl|tanggal)\\.?\\s+)("+D+"(?:"+SEP+D+")*)$","i"),function(_,pre,list){
      var days=list.split(/\s*[.,]\s*|\s+/).filter(Boolean).map(function(x){return String(parseInt(x,10))});
      return (/^(tgl|tanggal)/i.test(pre)?"":pre)+days.join(", ")+" "+monAb();
    });
  }
  // "16,17,18. treatment" -> "(16, 17, 18 Okt) Treatment" (tanggal ditutup titik)
  function dateNote(n){
    n=(n||"").replace(/\s+/g," ").trim();
    var D="(?:3[01]|[12]\\d|0?[1-9])",MO="jan|feb|mar|apr|mei|jun|jul|agu|agt|sep|okt|nov|des";
    var m=n.match(new RegExp("^("+D+"(?:\\s*[,.]\\s*"+D+"|\\s+"+D+")*)(?:\\s*("+MO+"))?\\s*\\.(?=\\s|$)\\s*(.*)$","i"));
    if(!m)return null;
    var days=m[1].split(/\s*[,.]\s*|\s+/).filter(Boolean).map(function(x){return String(parseInt(x,10))});
    var mo=monAb();
    if(m[2])mo=moFix(m[2]);
    var rest=(m[3]||"").trim();rest=rest.charAt(0).toUpperCase()+rest.slice(1);
    return "( "+days.join(", ")+" "+mo+" )"+(rest?" "+rest:"");
  }
  function line(label,c){
    var raw=(c.v||"").trim();
    var f=fmt(raw),s=label+" = ";
    if(f){s+=(/^[+\-\u00b1]/.test(f)?"":"\u00b1 ")+f+" mt"}
    else s+="-";
    var dn=dateNote(c.n);if(dn)s+=" "+dn;else{var nt=tidyNote(c.n);if(nt)s+=" ( "+nt+" )"}
    return "\u2022 "+s;
  }
  function uniBold(t){return t.replace(/[A-Za-z0-9]/g,function(ch){var c=ch.charCodeAt(0);return String.fromCodePoint(c<58?0x1D7EC+c-48:c<91?0x1D5D4+c-65:0x1D5EE+c-97)})}
  function B(t,tg){return tg==="plain"?t:tg?uniBold(t):"*"+t+"*"}
  function build(tg){
    var out=[B("VISUAL STOCK",tg),""];
    var d=S.tgl?new Date(S.tgl+"T00:00:00"):new Date();
    out.push(HARI[d.getDay()]+", "+d.getDate()+" "+BULAN[d.getMonth()]+" "+d.getFullYear());
    var jm=(S.jam||"").replace(":",".");
    out.push("Shift : "+(S.shift||"-")+(jm?" ( "+jm+" )":""));
    JETTY.forEach(function(j){
      var lines=[];
      j.groups.forEach(function(g){
        var rows=(S.f[j.id+"|"+g.g]||[]).filter(function(c){return (c.v||"").trim()||(c.n||"").trim()});
        if(g.opts){rows=rows.map(function(c,i){return {c:c,i:i}}).sort(function(a,b){
          var x=g.opts.indexOf(a.c.o),y=g.opts.indexOf(b.c.o);if(x<0)x=99;if(y<0)y=99;return x-y||a.i-b.i}).map(function(z){return z.c})}
        rows.forEach(function(c){lines.push(line(g.g+(c.o?" "+c.o:""),c))});
      });
      if(lines.length){out.push("");out.push(B(j.nama,tg)+" :");out=out.concat(lines)}
    });
    return out.join("\n");
  }

  // ---------- dialog, salin, kirim ----------
  var dlg=document.getElementById("dlg"),outEl=document.getElementById("out"),askD=document.getElementById("ask"),askCb=null;
  function toast(t,ms){var e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(e._t);e._t=setTimeout(function(){e.classList.remove("show")},ms||1800)}
  // cadangan untuk browser tanpa <dialog> (mis. iOS di bawah 15.4)
  [].forEach.call(document.querySelectorAll("dialog"),function(d){
    if(typeof d.showModal==="function")return;
    d.classList.add("pf");d.style.display="none";
    d.showModal=function(){d.setAttribute("open","");d.style.display="block"};
    d.close=function(){d.removeAttribute("open");d.style.display="none"};
  });
  function ask(msg,cb){document.getElementById("askMsg").textContent=msg;askCb=cb;askD.showModal()}
  document.getElementById("askNo").onclick=function(){askCb=null;askD.close()};
  document.getElementById("askYes").onclick=function(){var f=askCb;askCb=null;askD.close();if(f)f()};
  function flash(btn,txt,ms){var o=btn.dataset.t||btn.textContent;btn.dataset.t=o;btn.textContent=txt;clearTimeout(btn._t);btn._t=setTimeout(function(){btn.textContent=o},ms||1800)}
  function copy(text){
    return new Promise(function(res,rej){
      function legacy(){
        var ok=false,t=document.createElement("textarea");
        t.value=text;t.setAttribute("readonly","");
        t.style.cssText="position:fixed;top:0;left:0;width:1px;height:1px;opacity:0";
        (document.querySelector("dialog[open]")||document.body).appendChild(t);
        try{t.focus();t.select();t.setSelectionRange(0,text.length);ok=document.execCommand("copy")}catch(e){ok=false}
        if(t.parentNode)t.parentNode.removeChild(t);
        ok?res():rej();
      }
      try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(res,legacy)}else legacy()}catch(e){legacy()}
    });
  }
  function selectOut(){try{var rg=document.createRange();rg.selectNodeContents(outEl);var se=window.getSelection();se.removeAllRanges();se.addRange(rg)}catch(e){}}

  function fmtTgl(t){var d=new Date(t+"T00:00:00");return d.getDate()+" "+BULAN[d.getMonth()]+" "+d.getFullYear()}
  function ymd(d){return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
  // Shift 2 (19.30 - 07.30) yang lewat tengah malam tetap memakai tanggal kemarin
  function dateOk(){
    if(S.tgl===today())return true;
    var n=new Date();if(S.shift!=="2"||n.getHours()>=8)return false;
    n.setDate(n.getDate()-1);return S.tgl===ymd(n);
  }
  function hasData(){return Object.keys(S.f).some(function(k){return S.f[k].some(used)})}
  function hasContent(){return Object.keys(S.f).some(function(k){return S.f[k].some(function(c){return (c.v||"").trim()||(c.n||"").trim()})})}
  function stale(){
    var b=document.getElementById("stale"),show=!dateOk()&&hasData();
    b.hidden=!show;
    if(show)document.getElementById("staleTx").textContent="Isian ini bertanggal "+fmtTgl(S.tgl)+", bukan hari ini."
  }
  function guard(go){
    var p=[];
    if(!S.shift)p.push("\u2022 Shift belum dipilih.");
    if(!dateOk())p.push("\u2022 Tanggal laporan "+fmtTgl(S.tgl)+" (bukan hari ini).");
    if(!hasContent())p.push("\u2022 Belum ada tonase atau keterangan.");
    if(!p.length)return go();
    ask(p.join("\n")+"\n\nTetap lanjut?",go);
  }
  document.getElementById("bStale").onclick=function(){document.getElementById("bReset").onclick()};
  document.addEventListener("visibilitychange",function(){if(!document.hidden)stale()});
  var navA=[].slice.call(document.querySelectorAll("nav a")),tick=false,forced=null;
  function spy(){
    tick=false;var cur=forced||JETTY[0].id;
    if(!forced)JETTY.forEach(function(j){var e=document.getElementById("j-"+j.id);if(e&&e.getBoundingClientRect().top<=120)cur=j.id});
    navA.forEach(function(a){var on=a.getAttribute("href")==="#j-"+cur;a.classList.toggle("on",on);if(on)a.setAttribute("aria-current","true");else a.removeAttribute("aria-current")});
  }
  window.addEventListener("scroll",function(){if(!tick){tick=true;requestAnimationFrame(spy)}},{passive:true});
  // halaman pendek tidak bisa menggulir sampai bagian atas jetty terakhir: sorotan mengikuti tombol yang diketuk, sampai pengguna menggulir sendiri
  navA.forEach(function(a){a.addEventListener("click",function(){forced=a.getAttribute("href").slice(3);spy()})});
  ["touchstart","wheel","keydown"].forEach(function(ev){window.addEventListener(ev,function(){forced=null},{passive:true})});
  document.getElementById("bPrev").onclick=function(){outEl.textContent=build("plain");dlg.showModal()};
  document.getElementById("bClose").onclick=function(){dlg.close()};
  document.getElementById("bCopy").onclick=function(){
    var btn=this;guard(function(){doCopy(btn)})};
  function doCopy(btn){
    copy(build("plain")).then(function(){flash(btn,"Tersalin \u2713")},function(){selectOut();flash(btn,"Gagal: tekan lama teks, lalu Salin",4000)});
  };
  var dsend=document.getElementById("dsend");
  function openUrl(url){dsend.close();var w=null;try{w=window.open(url,"_blank")}catch(e){}if(!w){window.location.href=url}}
  document.getElementById("bSend").onclick=function(){guard(function(){dsend.showModal()})};
  document.getElementById("sNo").onclick=function(){dsend.close()};
  document.getElementById("sWa").onclick=function(){openUrl("https://wa.me/?text="+encodeURIComponent(build()))};
  document.getElementById("sTg").onclick=function(){openUrl("https://t.me/share/url?url=%20&text="+encodeURIComponent(build(true)))};
  document.getElementById("bReset").onclick=function(){
    ask("Kosongkan semua isian? Tanggal diatur ke hari ini.",function(){autoDate=false;S=blank();save();syncHead();render();window.scrollTo(0,0)});
  };

  // ---------- offline, update, debug ----------
  var netEl=document.getElementById("net"),updEl=document.getElementById("upd");
  function netSync(first){
    var off=!navigator.onLine;netEl.hidden=!off;
    if(!first){__log("info",off?"Offline":"Online");toast(off?"Offline: isian tetap tersimpan":"Kembali online")}
  }
  window.addEventListener("online",function(){netSync()});
  window.addEventListener("offline",function(){netSync()});

  var swReg=null,wantReload=false;
  function showUpd(w){
    updEl.hidden=false;
    document.getElementById("bUpd").onclick=function(){wantReload=true;try{w.postMessage({type:"SKIP_WAITING"})}catch(e){location.reload()}};
  }
  var inApk=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
  if(inApk){
    __log("info","Berjalan sebagai APK: file sudah ada di dalam aplikasi, SW tidak dipakai");
  }else if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("sw.js").then(function(reg){
        swReg=reg;__log("info","SW terdaftar, scope "+reg.scope);
        function watch(w){w.addEventListener("statechange",function(){
          __log("info","SW "+w.state);
          if(w.state==="installed"&&navigator.serviceWorker.controller)showUpd(w);
        })}
        if(reg.waiting&&navigator.serviceWorker.controller)showUpd(reg.waiting);
        reg.addEventListener("updatefound",function(){if(reg.installing)watch(reg.installing)});
        document.addEventListener("visibilitychange",function(){if(!document.hidden)reg.update().catch(function(){})});
      }).catch(function(e){__log("error","SW gagal: "+e.message)});
      navigator.serviceWorker.addEventListener("controllerchange",function(){
        __log("info","SW baru mengambil alih");
        if(wantReload)location.reload();
      });
    });
  }else{
    __log("warn","SW tidak aktif (butuh https atau localhost, protokol: "+location.protocol+")");
  }

  var dbgD=document.getElementById("dbg"),dbgOut=document.getElementById("dbgOut");
  function hm(t){var d=new Date(t);return ymd(d)+" "+p2(d.getHours())+":"+p2(d.getMinutes())+":"+p2(d.getSeconds())}
  function dbgReport(){
    var nv=navigator,c=nv.serviceWorker&&nv.serviceWorker.controller,raw="";
    try{raw=localStorage.getItem(KEY)||""}catch(e){}
    var sw="belum terdaftar";
    if(swReg)sw=[swReg.active?"aktif":"",swReg.waiting?"menunggu":"",swReg.installing?"memasang":""].filter(Boolean).join(" + ")||"-";
    var head=[
      "VISUAL STOCK - DEBUG",
      "Waktu        : "+new Date().toLocaleString("id-ID"),
      "Online       : "+(nv.onLine?"ya":"tidak"),
      "Protokol     : "+location.protocol,
      "Mode         : "+(inApk?"APK Android (offline bawaan)":((window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||nv.standalone?"terpasang (standalone)":"browser")),
      "SW didukung  : "+("serviceWorker" in nv?"ya":"tidak"),
      "SW status    : "+sw,
      "SW kontrol   : "+(c?"ya (offline siap)":"belum (muat ulang sekali saat online)"),
      "Data tersimpan: "+raw.length+" karakter",
      "Tanggal/Shift: "+S.tgl+" / "+(S.shift||"-"),
      "Browser      : "+nv.userAgent
    ];
    var p=window.caches?caches.keys().then(function(ks){
      return Promise.all(ks.map(function(k){
        return caches.open(k).then(function(ca){return ca.keys()}).then(function(rq){
          return "Cache "+k+": "+(rq.map(function(r){return new URL(r.url).pathname.split("/").pop()||"/"}).join(", ")||"(kosong)")});
      }));
    }):Promise.resolve([]);
    return p.catch(function(){return ["Cache: gagal dibaca"]}).then(function(cs){
      var lg=__logs().map(function(e){return hm(e.t)+" ["+e.l+"] "+e.m});
      return head.concat(cs.length?cs:["Cache        : tidak ada"],["","--- LOG ("+lg.length+") ---"],lg.length?lg:["(kosong)"]).join("\n");
    });
  }
  function dbgFill(){dbgReport().then(function(t){dbgOut.textContent=t;dbgOut.scrollTop=dbgOut.scrollHeight})}
  function openDbg(){dbgFill();dbgD.showModal()}
  window.__onlog=function(){if(dbgD.open)dbgFill()};
  document.getElementById("dbgClose").onclick=function(){dbgD.close()};
  document.getElementById("dbgClr").onclick=function(){__clearLogs();dbgFill()};
  document.getElementById("dbgCopy").onclick=function(){
    var b=this;copy(dbgOut.textContent).then(function(){flash(b,"Tersalin \u2713")},function(){flash(b,"Gagal salin",2500)});
  };
  document.getElementById("dbgUpd").onclick=function(){
    var b=this;
    if(!swReg){flash(b,"SW belum aktif",2500);return}
    if(!navigator.onLine){flash(b,"Harus online",2500);return}
    swReg.update().then(function(){__log("info","Cek update selesai");flash(b,"Sudah dicek \u2713",2000)},function(e){__log("error","Cek update gagal: "+e.message);flash(b,"Gagal",2500)});
  };
  document.getElementById("dbgReset").onclick=function(){
    var b=this;
    if(!navigator.onLine){flash(b,"Harus online",2500);return}
    ask("Hapus cache offline dan muat ulang? Isian laporan tidak dihapus.",function(){
      var jobs=[];
      if(navigator.serviceWorker)jobs.push(navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.unregister()}))}));
      if(window.caches)jobs.push(caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))}));
      Promise.all(jobs).then(function(){__log("warn","Cache dan SW direset");location.reload()},function(e){__log("error","Reset gagal: "+e.message)});
    });
  };
  // buka panel debug: ketuk tulisan kredit 5x, atau tambahkan ?debug di alamat
  (function(){
    var cr=document.querySelector(".credit"),n=0,t;
    cr.addEventListener("click",function(){
      n++;clearTimeout(t);t=setTimeout(function(){n=0},1500);
      if(n>=5){n=0;openDbg()}
    });
  })();

  __log("info","Aplikasi dimulai ("+(navigator.onLine?"online":"offline")+")");
  syncHead();render();spy();netSync(true);
  if(/[?&#]debug\b/.test(location.search+location.hash))openDbg();
})();
</script>
